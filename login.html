<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>X - Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="login-container">
    <!-- Left/Top Side: Logo -->
    <aside class="login-hero">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"></path>
      </svg>
    </aside>

    <!-- Right/Bottom Side: Form -->
    <main class="login-content">
      <h1>Happening now.</h1>
      
      <div class="login-actions">
        <button class="btn btn--primary">Continue with Google</button>
        <button class="btn btn--primary">Continue with Apple</button>
        
        <div class="divider">
          <span>or</span>
        </div>
        
        <input type="text" id="login-input" class="form-input" placeholder="Phone, email, or username">
        
        <button type="button" id="btn-next" class="btn btn--outline">Next</button>
        
        <button class="btn btn--outline">Forgot password?</button>
        
        <p class="terms-text">
          By continuing, you agree to our <a href="#">Terms of Service</a>, 
          <a href="#">Privacy Policy</a> and <a href="#">Cookie Use</a>.
        </p>
      </div>
    </main>
  </div>

  <footer class="login-footer">
    <a href="#">About</a>
    <a href="#">Help Center</a>
    <a href="#">Terms of Service</a>
    <a href="#">Privacy Policy</a>
    <a href="#">Cookie Policy</a>
    <a href="#">Accessibility</a>
    <a href="#">Ads info</a>
    <span>© 2026 X Corp.</span>
  </footer>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="login.js"></script>

</body>
</html>
